[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-desktop"
version = "0.6.0"
description = "Cross-platform remote desktop (Ubuntu 18.04 compatible Qt5/PySide2 branch)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
  "mss>=9.0.1,<10",
  "Pillow>=9.5.0,<11",
  "pynput>=1.7.6",
  "PySide2==5.15.2.1; python_version < '3.11'",
  "PySide6>=6.6.0; python_version >= '3.11'",
]

[project.scripts]
remote-desktop = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["remote_desktop*"]
